<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexa ERP — Import & Export</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb;--p:#0b5cab;--dark:#0d1b34;--line:#e4e9f2}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08152b,#0b5cab)}
.loginbox{width:min(430px,92vw);background:#fff;border-radius:24px;padding:36px;box-shadow:0 30px 80px #0005}.brand{font-weight:800;font-size:24px;color:var(--p)}
.muted{color:#718096}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e0eb;border-radius:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}
.primary{padding:12px 16px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700}.small{padding:8px 11px;border:1px solid #d8e0eb;border-radius:8px;background:#fff}.danger{color:#a61b1b;border-color:#efb5b5}
.app{display:none;min-height:100vh}.side{position:fixed;width:255px;inset:0 auto 0 0;background:var(--dark);color:#dbe7fa;padding:22px 14px;overflow:auto}.side h2{color:#fff;margin:0 10px 22px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b9c8df;padding:10px 12px;border-radius:9px;margin:3px 0}.nav:hover,.nav.active{background:#ffffff15;color:#fff}.group{margin:16px 10px 5px;color:#6f86a9;font-size:10px;font-weight:800;text-transform:uppercase}.main{margin-left:255px}.bar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.wrap{max-width:1500px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #14213d0a}.num{font-size:28px;font-weight:800;color:var(--p)}
.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 13px;text-align:left;border-bottom:1px solid #edf0f5;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:18px;width:min(820px,96vw);padding:25px;max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50}.notice{padding:12px 14px;border-radius:10px;background:#fff7df;border:1px solid #f2d58b;color:#72530a}.ok{background:#eaf8ef;border-color:#b7e2c2;color:#175c2d}.err{background:#fff0f0;border-color:#f0b4b4;color:#8a1c1c}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#31598c;font-size:12px;font-weight:700}.stat{display:flex;justify-content:space-between;gap:15px;align-items:center}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap}
@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}.two{grid-template-columns:1fr}.bar{position:static}}
</style>
</head>
<body>
<div id="login" class="login"><form class="loginbox" id="loginForm"><div class="brand">NEXA ERP</div><h1>Secure Login</h1><p class="muted">Import, Export, Company & Compliance Management</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Sign in securely</button><p id="loginMsg" class="muted"></p></form></div>
<div id="app" class="app"><aside class="side"><h2>NEXA ERP</h2><div class="group">Operations</div><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="contracts">Contracts</button><button class="nav" data-page="shipments">Shipments</button><button class="nav" data-page="invoices">Invoices</button><button class="nav" data-page="customers">Customers / Importers</button><button class="nav" data-page="banks">Banks</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="currency">Live Currency</button><div class="group">Company Management</div><button class="nav" data-page="companies">Companies</button><button class="nav" data-page="branches">Branches</button><button class="nav" data-page="registrations">Registrations</button><div class="group">Compliance</div><button class="nav" data-page="gst">GST Filing JSON</button><button class="nav" data-page="itr">ITR Filing JSON</button><div class="group">Administration</div><button class="nav" data-page="users" id="usersNav">Users & Access</button><button class="nav" id="logout">Sign out</button></aside><main class="main"><header class="bar"><div><b id="pageTitle">Dashboard</b><div class="muted" id="userInfo"></div></div><span class="badge" id="roleBadge"></span></header><div class="wrap" id="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Add</h2><button type="button" class="small" id="closeModal">Close</button></div><form id="entityForm"></form></div></div><div id="toast" class="toast"></div>
<script src="/app.js" defer></script>
</body></html>
