<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexa ERP — Import & Export</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--p:#0b5cab;--dark:#0d1b34}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08152b,#0b5cab)}.loginbox{width:min(430px,92vw);background:#fff;border-radius:24px;padding:36px;box-shadow:0 30px 80px #0005}.brand{font-weight:800;font-size:24px;color:var(--p)}.muted{color:#718096}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:10px;background:#fff}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700}.app{display:none;min-height:100vh}.side{position:fixed;width:245px;inset:0 auto 0 0;background:var(--dark);color:#dbe7fa;padding:24px 15px}.side h2{color:#fff;margin:0 10px 24px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b9c8df;padding:12px 13px;border-radius:9px;margin:4px 0}.nav:hover,.nav.active{background:#ffffff15;color:#fff}.main{margin-left:245px}.bar{height:72px;background:#fff;border-bottom:1px solid #e4e9f2;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.wrap{max-width:1400px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:20px;box-shadow:0 8px 24px #14213d0a}.num{font-size:28px;font-weight:800;color:var(--p)}.section{margin-top:24px}.table{overflow:auto;background:#fff;border:1px solid #e4e9f2;border-radius:14px}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f5;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:8px 11px;border:1px solid #d8e0eb;border-radius:8px;background:#fff}.danger{color:#b42318}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:18px;width:min(620px,96vw);padding:25px;max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}.two{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><form class="loginbox" id="loginForm"><div class="brand">NEXA ERP</div><h1>Secure Login</h1><p class="muted">Import & Export Management</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Sign in securely</button><p id="loginMsg" class="muted"></p></form></div>
<div id="app" class="app"><aside class="side"><h2>NEXA ERP</h2><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="contracts">Contracts</button><button class="nav" data-page="shipments">Shipments</button><button class="nav" data-page="invoices">Invoices</button><button class="nav" data-page="customers">Customers / Importers</button><button class="nav" data-page="banks">Banks</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="users" id="usersNav">Users & Access</button><button class="nav" data-page="currency">Live Currency</button><button class="nav" id="logout">Sign out</button></aside><main class="main"><header class="bar"><div><b id="pageTitle">Dashboard</b><div class="muted" id="userInfo"></div></div><span class="badge" id="roleBadge"></span></header><div class="wrap" id="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Add</h2><button class="small" onclick="closeModal()">Close</button></div><form id="entityForm"></form></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let me=null;const titles={dashboard:'Dashboard',contracts:'Sales Contracts',shipments:'Shipments',invoices:'Invoices',customers:'Customers / Importers',banks:'Bank Master',products:'Products',users:'Users & Access',currency:'Live Exchange Rates'};
const schemas={banks:[['name','Bank Name'],['account','Account'],['branch','Branch'],['swift','SWIFT']],customers:[['company','Company'],['contact','Contact Person'],['email','Email'],['phone','Phone'],['address','Address'],['importer_bank','Importer Bank']],products:[['code','Product Code'],['name','Product Name'],['description','Description'],['unit','Unit'],['hs_code','HS Code']],contracts:[['contract_no','Contract No'],['customer_id','Customer ID'],['currency','Currency'],['amount','Amount'],['incoterm','Incoterm'],['payment_method','Payment Method'],['shipment_destination','Shipment Destination'],['last_shipment_date','Last Shipment Date'],['status','Status']],shipments:[['contract_id','Contract ID'],['mode','Transport Mode'],['origin','Origin'],['destination','Destination'],['eta','ETA'],['status','Status']],invoices:[['contract_id','Contract ID'],['invoice_no','Invoice No'],['currency','Currency'],['amount','Amount'],['status','Status']]};
async function api(path,opt={}){const r=await fetch('/api'+path,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}
async function boot(){try{const d=await api('/me');me=d.user;showApp();load('dashboard')}catch(e){showLogin()}}
function showLogin(){$('#login').style.display='grid';$('#app').style.display='none'}function showApp(){$('#login').style.display='none';$('#app').style.display='block';$('#userInfo').textContent=me.email+' · '+me.name;$('#roleBadge').textContent=me.role;if(me.role!=='admin')$('#usersNav').style.display='none'}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Signing in…';try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});me=d.user;showApp();load('dashboard')}catch(x){$('#loginMsg').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.reload()};document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.page)});
function card(title,value,sub){return `<div class="card"><div class="muted">${title}</div><div class="num">${value}</div><div class="muted">${sub||''}</div></div>`}
async function load(page){$('#pageTitle').textContent=titles[page];if(page==='dashboard')return dashboard();if(page==='currency')return currency();if(page==='users')return users();return entity(page)}
async function dashboard(){let counts={};for(const p of ['banks','customers','products','contracts','shipments','invoices']){try{counts[p]=(await api('/'+p)).data.length}catch{counts[p]='—'}}$('#content').innerHTML=`<div class="grid">${card('Banks',counts.banks,'Beneficiary banks')}${card('Customers',counts.customers,'Importers / buyers')}${card('Products',counts.products,'Trade product master')}${card('Contracts',counts.contracts,'Import / export contracts')}${card('Shipments',counts.shipments,'Logistics')}${card('Invoices',counts.invoices,'Commercial invoices')}</div><div class="section card"><h2>ERP Control Center</h2><p class="muted">Manage the complete import/export lifecycle from master data to contracts, shipments, invoices and live INR exchange rates.</p><div class="actions"><button class="small" onclick="load('contracts')">Sales Contracts</button><button class="small" onclick="load('shipments')">Shipment Tracking</button><button class="small" onclick="load('currency')">Live Currency</button></div></div>`}
async function entity(page){const d=await api('/'+page);const rows=d.data||[];const cols=schemas[page]||[];$('#content').innerHTML=`<div class="actions" style="margin-bottom:15px"><button class="primary" style="width:auto" onclick="openEntity('${page}')">+ Add ${titles[page]}</button></div><div class="table"><table><thead><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${escapeHtml(r[x[0]]??'')}</td>`).join('')}<td>${r.created_at?new Date(r.created_at*1000).toLocaleString():''}</td></tr>`).join('')||'<tr><td colspan="20">No records yet</td></tr>'}</tbody></table></div>`}
function openEntity(page){const cols=schemas[page];$('#modalTitle').textContent='Add '+titles[page];$('#entityForm').innerHTML=`<div class="two">${cols.map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" ${k.includes('date')?'type="date"':''} ${k==='amount'?'type="number" step="0.01"':''}></div>`).join('')}</div><button class="primary">Save</button>`;$('#entityForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{await api('/'+page,{method:'POST',body:JSON.stringify(o)});closeModal();toast('Saved successfully');load(page)}catch(x){toast(x.message)}};$('#modal').style.display='grid'}
async function users(){const d=await api('/users');$('#content').innerHTML=`<div class="actions" style="margin-bottom:15px"><button class="primary" style="width:auto" onclick="openUser()">+ Add User</button></div><div class="table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th></tr></thead><tbody>${d.data.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td><td>${r.role}</td><td>${r.active?'Yes':'No'}</td><td>${new Date(r.created_at*1000).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
function openUser(){$('#modalTitle').textContent='Create ERP User';$('#entityForm').innerHTML='<div class="two"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="12" required></div><div class="field"><label>Role</label><select name="role"><option>operator</option><option>manager</option><option>viewer</option><option>admin</option></select></div></div><button class="primary">Create User</button>';$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('User created');users()}catch(x){toast(x.message)}};$('#modal').style.display='grid'}
async function currency(){const d=await api('/fx?base=INR');const entries=Object.entries(d.rates||{}).sort();$('#content').innerHTML=`<div class="card"><h2>Live Exchange Rates — INR Base</h2><p class="muted">1 INR converted to supported currencies. Provider update: ${d.updated_at||'current'}</p><input id="fxSearch" class="field" placeholder="Search currency code…" oninput="filterFx()"><div class="table"><table id="fxTable"><thead><tr><th>Currency</th><th>Rate for 1 INR</th><th>Inverse</th></tr></thead><tbody>${entries.map(([c,v])=>`<tr><td>${c}</td><td>${Number(v).toFixed(6)}</td><td>₹${(1/Number(v)).toFixed(4)} per 1 ${c}</td></tr>`).join('')}</tbody></table></div></div>`}
function filterFx(){const q=$('#fxSearch').value.toUpperCase();document.querySelectorAll('#fxTable tbody tr').forEach(r=>r.style.display=r.children[0].textContent.includes(q)?'':'none')}
function closeModal(){$('#modal').style.display='none'}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot();
</script></body></html>
