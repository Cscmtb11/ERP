<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexa ERP — Import & Export</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--p:#0b5cab;--dark:#0d1b34}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08152b,#0b5cab)}.loginbox{width:min(430px,92vw);background:#fff;border-radius:24px;padding:36px;box-shadow:0 30px 80px #0005}.brand{font-weight:800;font-size:24px;color:var(--p)}.muted{color:#718096}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e0eb;border-radius:10px;background:#fff}.primary{padding:12px 16px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700}.app{display:none;min-height:100vh}.side{position:fixed;width:255px;inset:0 auto 0 0;background:var(--dark);color:#dbe7fa;padding:22px 14px;overflow:auto}.side h2{color:#fff;margin:0 10px 22px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b9c8df;padding:10px 12px;border-radius:9px;margin:3px 0}.nav:hover,.nav.active{background:#ffffff15;color:#fff}.group{margin:16px 10px 5px;color:#6f86a9;font-size:10px;font-weight:800;text-transform:uppercase}.main{margin-left:255px}.bar{height:72px;background:#fff;border-bottom:1px solid #e4e9f2;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.wrap{max-width:1500px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:20px;box-shadow:0 8px 24px #14213d0a}.num{font-size:28px;font-weight:800;color:var(--p)}.table{overflow:auto;background:#fff;border:1px solid #e4e9f2;border-radius:14px}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 13px;text-align:left;border-bottom:1px solid #edf0f5;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.small{padding:8px 11px;border:1px solid #d8e0eb;border-radius:8px;background:#fff}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:18px;width:min(760px,96vw);padding:25px;max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none}.notice{padding:12px 14px;border-radius:10px;background:#fff7df;border:1px solid #f2d58b;color:#72530a}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}.two{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="login"><form class="loginbox" id="loginForm"><div class="brand">NEXA ERP</div><h1>Secure Login</h1><p class="muted">Import, Export, Company & Compliance Management</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Sign in securely</button><p id="loginMsg" class="muted"></p></form></div>
<div id="app" class="app"><aside class="side"><h2>NEXA ERP</h2><div class="group">Operations</div><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="contracts">Contracts</button><button class="nav" data-page="shipments">Shipments</button><button class="nav" data-page="invoices">Invoices</button><button class="nav" data-page="customers">Customers / Importers</button><button class="nav" data-page="banks">Banks</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="currency">Live Currency</button><div class="group">Company Management</div><button class="nav" data-page="companies">Companies</button><button class="nav" data-page="branches">Branches</button><button class="nav" data-page="registrations">Registrations</button><div class="group">Compliance</div><button class="nav" data-page="gst">GST Filing JSON</button><button class="nav" data-page="itr">ITR Filing JSON</button><div class="group">Administration</div><button class="nav" data-page="users" id="usersNav">Users & Access</button><button class="nav" id="logout">Sign out</button></aside><main class="main"><header class="bar"><div><b id="pageTitle">Dashboard</b><div class="muted" id="userInfo"></div></div><span id="roleBadge"></span></header><div class="wrap" id="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Add</h2><button class="small" onclick="closeModal()">Close</button></div><form id="entityForm"></form></div></div><div id="toast" class="toast"></div>
<script>const $=s=>document.querySelector(s);let me=null;const titles={dashboard:'Dashboard',contracts:'Sales Contracts',shipments:'Shipments',invoices:'Invoices',customers:'Customers / Importers',banks:'Bank Master',products:'Products',currency:'Live Exchange Rates',companies:'Company Management',branches:'Branch Management',registrations:'Registrations',gst:'GST Filing JSON',itr:'ITR Filing JSON',users:'Users & Access'};const schemas={banks:[['name','Bank Name'],['account','Account'],['branch','Branch'],['swift','SWIFT']],customers:[['company','Company'],['contact','Contact Person'],['email','Email'],['phone','Phone'],['address','Address'],['importer_bank','Importer Bank']],products:[['code','Product Code'],['name','Product Name'],['description','Description'],['unit','Unit'],['hs_code','HS Code']],contracts:[['contract_no','Contract No'],['customer_id','Customer ID'],['currency','Currency'],['amount','Amount'],['incoterm','Incoterm'],['payment_method','Payment Method'],['shipment_destination','Shipment Destination'],['last_shipment_date','Last Shipment Date'],['status','Status']],shipments:[['contract_id','Contract ID'],['mode','Transport Mode'],['origin','Origin'],['destination','Destination'],['eta','ETA'],['status','Status']],invoices:[['contract_id','Contract ID'],['invoice_no','Invoice No'],['currency','Currency'],['amount','Amount'],['status','Status']]};async function api(path,opt={}){const r=await fetch('/api'+path,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function boot(){try{const d=await api('/me');me=d.user;showApp();load('dashboard')}catch{showLogin()}}function showLogin(){$('#login').style.display='grid';$('#app').style.display='none'}function showApp(){$('#login').style.display='none';$('#app').style.display='block';$('#userInfo').textContent=me.email+' · '+me.name;$('#roleBadge').textContent=me.role;if(me.role!=='admin')$('#usersNav').style.display='none'}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Signing in…';try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});me=d.user;showApp();load('dashboard')}catch(x){$('#loginMsg').textContent=x.message}};$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.reload()};document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.page)});function card(t,v,s){return `<div class="card"><div class="muted">${t}</div><div class="num">${v}</div><div class="muted">${s||''}</div></div>`}async function load(p){$('#pageTitle').textContent=titles[p];if(p==='dashboard')return dashboard();if(p==='currency')return currency();if(p==='users')return users();if(p==='companies'||p==='branches'||p==='registrations')return management(p);if(p==='gst'||p==='itr')return compliance(p);return entity(p)}async function dashboard(){let c={};for(const p of ['banks','customers','products','contracts','shipments','invoices']){try{c[p]=(await api('/'+p)).data.length}catch{c[p]='—'}}$('#content').innerHTML=`<div class="grid">${card('Banks',c.banks,'Beneficiary banks')}${card('Customers',c.customers,'Importers / buyers')}${card('Products',c.products,'Trade master')}${card('Contracts',c.contracts,'Import / export contracts')}${card('Shipments',c.shipments,'Logistics')}${card('Invoices',c.invoices,'Commercial invoices')}</div><div class="grid" style="margin-top:16px">${card('Companies','Manage','Legal entities')}${card('Branches','Manage','Locations & GST registrations')}${card('Registrations','Manage','PAN / GSTIN / IEC / CIN / TAN / MSME')}${card('Compliance','GST + ITR','Generate working JSON')}</div><div class="card" style="margin-top:16px"><h2>Company & Compliance Control Center</h2><p class="muted">Maintain legal entities and branches, update statutory registrations, and generate structured GST/ITR working files from ERP data.</p></div>`}async function entity(page){const d=await api('/'+page),rows=d.data||[],cols=schemas[page]||[];$('#content').innerHTML=`<div class="actions"><button class="primary" onclick="openEntity('${page}')">+ Add ${titles[page]}</button></div><div class="table"><table><thead><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}<td>${r.created_at?new Date(r.created_at*1000).toLocaleString():''}</td></tr>`).join('')||'<tr><td colspan="20">No records yet</td></tr>'}</tbody></table></div>`}function openEntity(page){const cols=schemas[page];$('#modalTitle').textContent='Add '+titles[page];$('#entityForm').innerHTML=`<div class="two">${cols.map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" ${k.includes('date')?'type="date"':''} ${k==='amount'?'type="number" step="0.01"':''}></div>`).join('')}</div><button class="primary">Save</button>`;$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/'+page,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Saved');load(page)}catch(x){toast(x.message)}};$('#modal').style.display='grid'}
async function management(page){const d=await api('/'+page),rows=d.data||[];if(page==='companies'){$('#content').innerHTML=`<div class="actions"><button class="primary" onclick="openCompany()">+ Add Company</button></div><div class="table"><table><thead><tr><th>Legal Name</th><th>Trade Name</th><th>PAN</th><th>TAN</th><th>CIN</th><th>Address</th><th>Email</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.legal_name)}</td><td>${esc(r.trade_name)}</td><td>${esc(r.pan)}</td><td>${esc(r.tan)}</td><td>${esc(r.cin)}</td><td>${esc(r.registered_address)}</td><td>${esc(r.email)}</td></tr>`).join('')||'<tr><td colspan="7">No companies</td></tr>'}</tbody></table></div>`}else if(page==='branches'){$('#content').innerHTML=`<div class="actions"><button class="primary" onclick="openBranch()">+ Add Branch</button></div><div class="table"><table><thead><tr><th>Company</th><th>Code</th><th>Name</th><th>State</th><th>GST State Code</th><th>PIN</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.company_name)}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.state)}</td><td>${esc(r.state_code)}</td><td>${esc(r.pincode)}</td><td>${r.active?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="7">No branches</td></tr>'}</tbody></table></div>`}else{$('#content').innerHTML=`<div class="actions"><button class="primary" onclick="openRegistration()">+ Update Registration</button></div><div class="table"><table><thead><tr><th>Company</th><th>Branch</th><th>Type</th><th>Number</th><th>Issued</th><th>Expiry</th><th>Status</th><th>Authority</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.company_name)}</td><td>${esc(r.branch_name)}</td><td>${esc(r.registration_type)}</td><td>${esc(r.registration_number)}</td><td>${esc(r.registration_date)}</td><td>${esc(r.expiry_date)}</td><td>${esc(r.status)}</td><td>${esc(r.issuing_authority)}</td></tr>`).join('')||'<tr><td colspan="8">No registrations</td></tr>'}</tbody></table></div>`}}
async function companyList(){return (await api('/companies')).data||[]}async function openCompany(){const fields=[['legal_name','Legal Name'],['trade_name','Trade Name'],['pan','PAN'],['tan','TAN'],['cin','CIN'],['constitution','Constitution'],['registered_address','Registered Address'],['email','Email'],['phone','Phone'],['website','Website'],['financial_year_start','Financial Year Start']];$('#modalTitle').textContent='Add Company';$('#entityForm').innerHTML=`<div class="two">${fields.map(x=>`<div class="field"><label>${x[1]}</label><input name="${x[0]}"></div>`).join('')}</div><button class="primary">Save Company</button>`;$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/companies',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Company added');management('companies')}catch(x){toast(x.message)}};$('#modal').style.display='grid'}async function openBranch(){const cs=await companyList();$('#modalTitle').textContent='Add Branch';$('#entityForm').innerHTML=`<div class="two"><div class="field"><label>Company</label><select name="company_id" required>${cs.map(c=>`<option value="${c.id}">${esc(c.legal_name)}</option>`).join('')}</select></div><div class="field"><label>Branch Code</label><input name="code" required></div><div class="field"><label>Branch Name</label><input name="name" required></div><div class="field"><label>Address</label><input name="address"></div><div class="field"><label>City</label><input name="city"></div><div class="field"><label>State</label><input name="state"></div><div class="field"><label>State Code</label><input name="state_code"></div><div class="field"><label>PIN</label><input name="pincode"></div><div class="field"><label>Email</label><input name="email"></div><div class="field"><label>Phone</label><input name="phone"></div></div><button class="primary">Save Branch</button>`;$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/branches',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Branch added');management('branches')}catch(x){toast(x.message)}};$('#modal').style.display='grid'}async function openRegistration(){const cs=await companyList(),bs=await api('/branches');$('#modalTitle').textContent='Update Registration';$('#entityForm').innerHTML=`<div class="two"><div class="field"><label>Company</label><select name="company_id" required>${cs.map(c=>`<option value="${c.id}">${esc(c.legal_name)}</option>`).join('')}</select></div><div class="field"><label>Branch</label><select name="branch_id"><option value="">Company-level</option>${(bs.data||[]).map(b=>`<option value="${b.id}">${esc(b.name)} — ${esc(b.code)}</option>`).join('')}</select></div><div class="field"><label>Registration Type</label><select name="registration_type"><option>GSTIN</option><option>PAN</option><option>TAN</option><option>IEC</option><option>CIN</option><option>MSME_UDYAM</option><option>FSSAI</option><option>IMPORT_EXPORT_LICENSE</option><option>OTHER</option></select></div><div class="field"><label>Registration Number</label><input name="registration_number" required></div><div class="field"><label>Registration Date</label><input name="registration_date" type="date"></div><div class="field"><label>Expiry Date</label><input name="expiry_date" type="date"></div><div class="field"><label>Status</label><select name="status"><option>active</option><option>pending</option><option>expired</option><option>suspended</option></select></div><div class="field"><label>Issuing Authority</label><input name="issuing_authority"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div></div><button class="primary">Save Registration</button>`;$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/registrations',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Registration updated');management('registrations')}catch(x){toast(x.message)}};$('#modal').style.display='grid'}
async function compliance(page){const cs=await companyList();const gst=page==='gst';$('#content').innerHTML=`<div class="card"><h2>${gst?'GST Filing JSON Generator':'ITR Filing JSON Generator'}</h2><div class="notice">Generated files are ERP working JSON. They are not represented as direct government portal submissions. Validate against the current GST / Income Tax schema before filing.</div><form id="compForm" style="margin-top:16px"><div class="two"><div class="field"><label>Company</label><select name="company_id">${cs.map(c=>`<option value="${c.id}" data-pan="${esc(c.pan||'')}" data-name="${esc(c.legal_name)}">${esc(c.legal_name)}</option>`).join('')}</select></div>${gst?`<div class="field"><label>GSTIN</label><input name="gstin" required></div><div class="field"><label>Return Type</label><select name="return_type"><option>GSTR1</option><option>GSTR3B</option><option>GSTR9</option><option>GSTR9C</option></select></div><div class="field"><label>Financial Year</label><input name="financial_year" placeholder="2026-27"></div><div class="field"><label>Period</label><input name="period" placeholder="2026-09"></div><div class="field"><label>Invoices JSON</label><textarea name="invoices" placeholder='[{"invoice_no":"INV-001","taxable_value":0,"igst":0,"cgst":0,"sgst":0}]'></textarea></div>`:`<div class="field"><label>PAN</label><input name="pan" required></div><div class="field"><label>Assessment Year</label><input name="assessment_year" placeholder="2027-28" required></div><div class="field"><label>ITR Form</label><select name="return_form"><option>ITR-3</option><option>ITR-4</option><option>ITR-5</option><option>ITR-6</option><option>ITR-7</option></select></div><div class="field"><label>Business Income JSON</label><textarea name="business_income" placeholder='{"turnover":0,"gross_profit":0,"net_profit":0}'></textarea></div><div class="field"><label>Deductions JSON</label><textarea name="deductions" placeholder='{"80C":0,"80D":0}'></textarea></div>`}</div><button class="primary">Generate JSON</button></form><pre id="jsonOut" style="white-space:pre-wrap;background:#0d1b34;color:#dbe7fa;padding:16px;border-radius:12px;margin-top:18px;display:none"></pre><button id="downloadJson" class="small" style="display:none;margin-top:10px">Download JSON</button></div>`;$('#compForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const parse=k=>{try{return f[k]?JSON.parse(f[k]):{}}catch{return {raw:f[k]}}};let body;if(gst)body={...f,invoices:parse('invoices')};else body={...f,business_income:parse('business_income'),deductions:parse('deductions')};delete body.company_id;try{const d=await api(gst?'/compliance/gst-json':'/compliance/itr-json',{method:'POST',body:JSON.stringify(body)});const text=JSON.stringify(d.payload,null,2);$('#jsonOut').textContent=text;$('#jsonOut').style.display='block';$('#downloadJson').style.display='inline-block';$('#downloadJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=d.filename;a.click()};toast('JSON generated')}catch(x){toast(x.message)}}}
async function users(){const d=await api('/users');$('#content').innerHTML=`<div class="actions"><button class="primary" onclick="openUser()">+ Add User</button></div><div class="table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th></tr></thead><tbody>${d.data.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${r.role}</td><td>${r.active?'Yes':'No'}</td><td>${new Date(r.created_at*1000).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}function openUser(){$('#modalTitle').textContent='Create ERP User';$('#entityForm').innerHTML='<div class="two"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="12" required></div><div class="field"><label>Role</label><select name="role"><option>operator</option><option>manager</option><option>viewer</option><option>admin</option></select></div></div><button class="primary">Create User</button>';$('#entityForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('User created');users()}catch(x){toast(x.message)}};$('#modal').style.display='grid'}async function currency(){const d=await api('/fx?base=INR'),entries=Object.entries(d.rates||{}).sort();$('#content').innerHTML=`<div class="card"><h2>Live Exchange Rates — INR Base</h2><p class="muted">Rates supplied by the configured exchange-rate provider. Verify rates before accounting/tax submission.</p><div class="table"><table><thead><tr><th>Currency</th><th>1 INR</th><th>1 Foreign Unit</th></tr></thead><tbody>${entries.map(([c,v])=>`<tr><td>${c}</td><td>${Number(v).toFixed(6)}</td><td>₹${(1/Number(v)).toFixed(4)}</td></tr>`).join('')}</tbody></table></div></div>`}function closeModal(){$('#modal').style.display='none'}boot();</script></body></html>
