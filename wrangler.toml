name = "erp"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Uncomment and fill these after creating the Cloudflare D1 database:
# [[d1_databases]]
# binding = "DB"
# database_name = "nexa-erp"
# database_id = "YOUR_D1_DATABASE_ID"

[observability]
enabled = true
