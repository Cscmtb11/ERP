name = "nexa-erp"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[secrets]
required = ["ADMIN_EMAIL", "ADMIN_PASSWORD_HASH"]

